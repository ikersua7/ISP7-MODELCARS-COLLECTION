<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard Colección de Maquetas 1/43</title>
    <!-- SheetJS (XLSX) Library -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-card-hover: #334155;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --racing-red: #ef4444;
            --racing-red-hover: #dc2626;
            --racing-accent: #38bdf8;
            --racing-gold: #f59e0b;
            --racing-emerald: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* HEADER */
        header {
            background-color: rgba(30, 41, 59, 0.9);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-shrink: 0;
            z-index: 20;
        }

        .header-title-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-icon {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            padding: 8px;
            color: var(--racing-red);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .badge {
            background: rgba(239, 68, 68, 0.2);
            color: var(--racing-red);
            border: 1px solid rgba(239, 68, 68, 0.3);
            font-size: 11px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 999px;
        }

        .btn-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            color: white;
        }

        .btn-red { background: var(--racing-red); }
        .btn-red:hover { background: var(--racing-red-hover); }
        .btn-emerald { background: var(--racing-emerald); }
        .btn-dark { background: #1e293b; border: 1px solid var(--border-color); color: var(--text-main); }
        .btn-dark:hover { background: var(--bg-card-hover); }

        /* LAYOUT */
        .layout-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        /* SIDEBAR */
        aside {
            width: 256px;
            background: rgba(30, 41, 59, 0.6);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
            transition: transform 0.2s ease;
        }

        .sidebar-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 12px;
            font-weight: bold;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .menu-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .menu-item {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            text-align: left;
        }

        .menu-item:hover { background: rgba(51, 65, 85, 0.5); }
        .menu-item.active { background: var(--racing-red); color: white; font-weight: bold; }

        .menu-count {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 999px;
            background: var(--bg-dark);
            color: var(--text-muted);
        }

        .sidebar-footer {
            padding: 12px;
            border-top: 1px solid var(--border-color);
            background: var(--bg-card);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* MAIN CONTENT */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: var(--bg-dark);
            overflow: hidden;
        }

        .toolbar {
            padding: 12px 16px;
            background: rgba(30, 41, 59, 0.4);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .search-input {
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 12px 8px 32px;
            font-size: 12px;
            color: white;
            width: 320px;
            outline: none;
        }

        .search-wrapper {
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            width: 14px;
            height: 14px;
        }

        .content-area {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 20px;
        }

        /* TABLA DE MODELOS */
        .table-container {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            min-width: 1000px;
        }

        th {
            background: rgba(30, 41, 59, 0.9);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(51, 65, 85, 0.5);
            font-size: 12px;
        }

        tr:hover { background: rgba(51, 65, 85, 0.3); }

        .img-thumb {
            width: 160px;
            height: 96px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .img-placeholder {
            width: 160px;
            height: 96px;
            border: 2px dashed var(--border-color);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: rgba(15, 23, 42, 0.5);
            color: var(--text-muted);
            font-size: 10px;
            gap: 4px;
        }

        .logo-thumb {
            width: 64px;
            height: 64px;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }

        .logo-placeholder {
            width: 64px;
            height: 64px;
            border: 2px dashed var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin: 0 auto;
            background: rgba(15, 23, 42, 0.5);
            color: var(--text-muted);
        }

        /* GRID VIEW */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .car-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-img {
            width: 100%;
            height: 256px;
            object-fit: cover;
        }

        .card-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        /* MODALES */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-overlay.active {
            display: flex !important;
        }

        .modal-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            overflow: hidden;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 41, 59, 0.5);
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .form-control {
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            color: white;
            font-size: 12px;
            outline: none;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        /* RESPONSIVE MÓVIL */
        @media (max-width: 768px) {
            aside {
                position: absolute;
                inset-y: 0;
                left: 0;
                z-index: 30;
                transform: translateX(-100%);
                background: rgba(30, 41, 59, 0.98);
            }

            aside.open {
                transform: translateX(0);
            }

            .mobile-toggle {
                display: block !important;
            }

            .desktop-only {
                display: none !important;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .search-input {
                width: 100%;
            }
        }

        .mobile-toggle {
            display: none;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- BARRA SUPERIOR -->
    <header>
        <div class="header-title-box">
            <button class="btn btn-dark mobile-toggle" onclick="toggleSidebar()">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <div class="header-icon">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>
            </div>
            <div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <h1 style="font-size: 16px; font-weight: 800;">Colección Maquetas 1/43</h1>
                    <span id="totalBadgeCount" class="badge">337 modelos</span>
                </div>
            </div>
        </div>

        <div class="btn-group desktop-only">
            <button onclick="exportToExcel()" class="btn btn-emerald">Exportar Excel</button>
            <button onclick="saveCollectionWithNotification()" class="btn btn-emerald">Guardar Colección</button>
            <button onclick="openCarModal()" class="btn btn-red">+ Añadir Modelo</button>
        </div>
    </header>

    <!-- LAYOUT PRINCIPAL -->
    <div class="layout-container">
        <!-- SIDEBAR -->
        <aside id="sidebar">
            <div class="sidebar-header">
                <span>Categorías (13)</span>
                <button class="btn btn-dark mobile-toggle" onclick="toggleSidebar()" style="padding: 4px;">✕</button>
            </div>

            <nav id="submenuContainer" class="menu-container"></nav>

            <div class="sidebar-footer">
                <button onclick="openGlobalLogoModal()" class="btn btn-dark" style="width: 100%; justify-content: center;">Asignar Logo por Marca</button>
                <button onclick="exportToExcel()" class="btn btn-emerald mobile-toggle" style="width: 100%; justify-content: center;">Exportar Excel</button>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px;">
                    <button onclick="exportCollection()" class="btn btn-dark" style="justify-content: center; font-size: 10px;">Exportar JSON</button>
                    <button onclick="triggerImport()" class="btn btn-dark" style="justify-content: center; font-size: 10px;">Importar JSON</button>
                    <input type="file" id="importFileInput" class="hidden" accept=".json" onchange="importCollection(event)">
                </div>
                <button onclick="resetToDefaultData()" class="btn" style="background: transparent; color: var(--text-muted); font-size: 10px; width: 100%; justify-content: center;">Restablecer 337 modelos</button>
            </div>
        </aside>

        <!-- CONTENIDO -->
        <main>
            <div class="toolbar">
                <div class="search-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                    <input type="text" id="searchInput" oninput="handleSearchInput()" placeholder="Buscar modelo, marca, fab, >700cv..." class="search-input">
                </div>

                <div style="display: flex; align-items: center; gap: 8px;">
                    <select id="sortFieldSelect" onchange="handleSortChange()" class="form-control">
                        <option value="name">Modelo</option>
                        <option value="brand">Marca</option>
                        <option value="power">Potencia (CV)</option>
                        <option value="speed">Velocidad (km/h)</option>
                        <option value="accel">Aceleración (0-100)</option>
                        <option value="maker">Fab. Miniatura</option>
                    </select>

                    <button id="sortOrderBtn" onclick="toggleSortDirection()" class="btn btn-dark" title="Invertir dirección de orden" style="padding: 8px 10px;">⬆️ ASC</button>

                    <div style="display: flex; gap: 4px; background: var(--bg-dark); padding: 2px; border-radius: 8px; border: 1px solid var(--border-color);">
                        <button id="viewListBtn" onclick="setViewMode('list')" class="btn btn-red" style="padding: 6px 10px;">Tabla</button>
                        <button id="viewGridBtn" onclick="setViewMode('grid')" class="btn btn-dark" style="padding: 6px 10px;">Grid</button>
                    </div>
                </div>
            </div>

            <div id="contentArea" class="content-area"></div>
        </main>
    </div>

    <!-- MODAL GESTIÓN MODELO -->
    <div id="carModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modalTitle" style="font-size: 14px; font-weight: bold;">Añadir Nuevo Modelo</h3>
                <button onclick="closeCarModal()" class="btn btn-dark" style="padding: 4px 8px;">✕</button>
            </div>
            <form id="carForm" onsubmit="handleCarFormSubmit(event)" class="modal-body">
                <input type="hidden" id="carFormId">
                <div class="form-group">
                    <label>Nombre del Modelo *</label>
                    <input type="text" id="carFormName" required class="form-control" placeholder="ej: FERRARI LAFERRARI">
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Marca *</label>
                        <input type="text" id="carFormBrand" required class="form-control" placeholder="ej: Ferrari">
                    </div>
                    <div class="form-group">
                        <label>Categoría *</label>
                        <select id="carFormCategory" required class="form-control"></select>
                    </div>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Potencia (CV)</label>
                        <input type="number" id="carFormPower" class="form-control" placeholder="963">
                    </div>
                    <div class="form-group">
                        <label>Velocidad (km/h)</label>
                        <input type="number" id="carFormSpeed" class="form-control" placeholder="350">
                    </div>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>0-100 km/h (s)</label>
                        <input type="number" step="0.1" id="carFormAccel" class="form-control" placeholder="2.9">
                    </div>
                    <div class="form-group">
                        <label>Fab. Miniatura</label>
                        <input type="text" id="carFormMaker" class="form-control" placeholder="Minichamps">
                    </div>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                    <button type="button" id="deleteCarBtn" onclick="handleModalDelete()" class="btn btn-red hidden" style="background: #991b1b;">🗑️ Eliminar</button>
                    <div style="display: flex; gap: 8px; margin-left: auto;">
                        <button type="button" onclick="closeCarModal()" class="btn btn-dark">Cancelar</button>
                        <button type="submit" class="btn btn-red">Guardar Modelo</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL LOGO GLOBAL -->
    <div id="globalLogoModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3 style="font-size: 14px; font-weight: bold;">Asignar Logo Global por Marca</h3>
                <button onclick="closeGlobalLogoModal()" class="btn btn-dark" style="padding: 4px 8px;">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Seleccionar Marca</label>
                    <select id="globalBrandSelect" class="form-control"></select>
                </div>
                <div class="form-group">
                    <label>Imagen del Logo</label>
                    <input type="file" id="globalBrandLogoFile" accept="image/*" class="form-control">
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px;">
                    <button type="button" onclick="closeGlobalLogoModal()" class="btn btn-dark">Cancelar</button>
                    <button type="button" onclick="applyGlobalLogo()" class="btn btn-emerald">Aplicar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const DB_NAME = 'Garage143DB';
        const DB_VERSION = 1;
        const STORE_NAME = 'cars';

        const CATEGORIES = [
            "EN COLECCIÓN", "COMPRAS 2026", "COMPRAS 2027", "URGENTES NO DISPONIBLES",

            "IMPRESIÓN 3D", "PEDIR MODELO 3D", "DUDAS", "PENDIENTES DE ANUNCIO", "RAROS"
        ];

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve();
                };
                request.onerror = (e) => reject(e);
            });
        }

        function loadCarsFromDB() {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const req = store.getAll();
                req.onsuccess = () => resolve(req.result);
                req.onerror = (e) => reject(e);
            });
        }

        function saveCarsToDB(carsList) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                store.clear();
                carsList.forEach(c => store.put(c));
                tx.oncomplete = () => resolve();
                tx.onerror = (e) => reject(e);
            });
        }

            const knownBrands = [
                "ALFA ROMEO", "ASTON MARTIN", "AUDI", "BENTLEY", "BUGATTI", "CHEVROLET", "CHRYSLER",
                "CITROEN", "DODGE", "FERRARI", "FORD", "GEMBALLA", "GUMPERT", "HONDA", "INFINITI",

                "MERCEDES", "NIO", "NISSAN", "NOBLE", "PAGANI", "PORSCHE", "RUF", "SALEEN", "SCG",
                "SSC", "TVR", "WIESMANN", "LOTUS", "GTA", "APOLLO", "ARCFOX", "MAZZANTI", "RENAULT",
                "PININFARINA", "PINNINFARINA", "ATS", "CZINGER", "ZENVO", "XIAOMI", "ARES", "DEUS",
                "BMW", "RIMAC", "KTM", "MARUSSIA", "MAZDA", "BRABHAM", "DEVEL", "GENESIS", "GORDON MURRAY",
                "ASPARK", "TOYOTA", "W MOTORS", "TRION", "REZVANI", "ARRINERA", "MOSLER", "APEX", "HONGQI",
                "TUSHEK", "HTT", "ARASH", "PRAGA", "ASCARI", "B ENGINEERING", "MCMURTRY", "TESLA",

                "DREAME", "ELEKTRON", "LANZANTE", "DELAGE"
            ];
            const upper = name.toUpperCase();
            for (let b of knownBrands) {
                if (upper.startsWith(b)) return b;
            }
            return name.split(' ')[0] || "Desconocida";
        }

        function generateDefaultSpecs(name, brand) {
            let hash = 0;
            for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
            const absHash = Math.abs(hash);

            const power = 500 + (absHash % 750);
            const speed = 290 + (absHash % 140);
            const accel = (2.1 + (absHash % 18) / 10).toFixed(1);

            const makers = ["Minichamps", "Spark", "AutoArt", "BBR", "LookSmart", "IXO Models", "Solido", "Schuco", "Kyosho", "Norev", "TSM Models"];
            const maker = makers[absHash % makers.length];

            return { power, speed, accel: parseFloat(accel), maker };
        }

        function generateInitialCars() {
            let idCounter = 1;
            const carsList = [];

            for (let category of CATEGORIES) {
                const names = RAW_DATA[category] || [];
                for (let name of names) {
                    const brand = extractBrand(name);
                    const specs = generateDefaultSpecs(name, brand);

                    carsList.push({
                        id: idCounter++,
                        category: category,
                        name: name,
                        brand: brand,
                        image: null,
                        logo: null,
                        power: specs.power,
                        speed: specs.speed,
                        accel: specs.accel,
                        maker: specs.maker
                    });
                }
            }
            return carsList;
        }

            } else {
                cars = storedCars;

            const dlAnchorElem = document.createElement('a');

            dlAnchorElem.setAttribute("download", `coleccion_maquetas_${new Date().toISOString().slice(0,10)}.json`);

        function exportToExcel() {
            const visibleCars = getFilteredAndSortedCars();
            if (visibleCars.length === 0) return alert('Sin modelos para exportar.');

            const excelRows = visibleCars.map((car, index) => ({
                "Nº": index + 1,
                "IMAGEN": car.image || "Sin imagen",
                "MODELO": car.name,
                "MARCA": car.brand,
                "LOGO": car.logo || "Sin logo",
                "POTENCIA (CV)": car.power || "-",
                "VELOCIDAD (km/h)": car.speed || "-",
                "0-100": car.accel ? `${car.accel}s` : "-",
                "FABRICANTE 1/43": car.maker || "-",
                "CATEGORÍA": car.category
            }));

            const worksheet = XLSX.utils.json_to_sheet(excelRows);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Maquetas");
            XLSX.writeFile(workbook, `Coleccion_Maquetas_${new Date().toISOString().slice(0,10)}.xlsx`);
        }

        function importCollection(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (Array.isArray(importedData)) {
                        cars = importedData;
                        await saveCarsToDB(cars);
                        renderSubmenus();
                        updateDashboard();
                        alert('Importación completada.');
                    }
                } catch(err) {
                    alert('Error en formato JSON.');
                }
            };
            reader.readAsText(file, "UTF-8");
        }

        /* 4. BÚSQUEDA Y FILTROS AVANZADOS (Soporta operadores numéricos > / <) */
        function getFilteredAndSortedCars() {
            let filtered = cars.filter(car => {
                const matchCategory = (activeCategory === 'ALL') || (car.category === activeCategory);
                if (!matchCategory) return false;

                if (!searchQuery) return true;

                // Soporte para búsquedas por operadores de comparación numéricos (>700, <300)
                if (searchQuery.startsWith('>') || searchQuery.startsWith('<')) {
                    const operator = searchQuery[0];
                    const targetVal = parseFloat(searchQuery.slice(1));
                    if (!isNaN(targetVal)) {
                        if (operator === '>') return car.power > targetVal || car.speed > targetVal;
                        if (operator === '<') return car.power < targetVal || car.speed < targetVal;
                    }
                }

                return car.name.toLowerCase().includes(searchQuery) ||
                       car.brand.toLowerCase().includes(searchQuery) ||
                       (car.maker && car.maker.toLowerCase().includes(searchQuery)) ||
                       (car.category && car.category.toLowerCase().includes(searchQuery)) ||
                       (car.power && car.power.toString().includes(searchQuery));
            });

            filtered.sort((a, b) => {
                let valA = a[currentSortField] ?? '';
                let valB = b[currentSortField] ?? '';

                if (typeof valA === 'string') valA = valA.toLowerCase();
                if (typeof valB === 'string') valB = valB.toLowerCase();

                if (valA < valB) return currentSortDirection === 'asc' ? -1 : 1;
                if (valA > valB) return currentSortDirection === 'asc' ? 1 : -1;
                return 0;
            });

            return filtered;
        }

                                <th style="text-align: right;">5. CV</th>
                                <th style="text-align: right;">6. km/h</th>
                                <th style="text-align: right;">7. 0-100</th>
                                <th>8. Fab. Miniatura</th>
                                <th style="text-align: center;">Acción</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            list.forEach(car => {
                const imgThumb = car.image 
                    ? `<img src="${car.image}" onerror="handleImageError(${car.id}, 'image')" class="img-thumb">`
                    : `<label class="img-placeholder">
                        <span>+ Subir Imagen 1/43</span>
                        <input type="file" accept="image/*" class="hidden" onchange="uploadCarImage(event, ${car.id})">
                       </label>`;

                const logoThumb = car.logo 
                    ? `<img src="${car.logo}" onerror="handleImageError(${car.id}, 'logo')" class="logo-thumb">`
                    : `<label class="logo-placeholder" title="Cargar Logo">
                        <span>🛡️</span>
                        <input type="file" accept="image/*" class="hidden" onchange="uploadCarLogo(event, ${car.id})">
                       </label>`;

                html += `
                    <tr>
                        <td>${imgThumb}</td>
                        <td style="font-weight: bold; color: white;">
                            ${car.name}
                            <div style="font-size: 10px; color: var(--text-muted); font-weight: normal;">${car.category}</div>
                        </td>
                        <td style="font-weight: 600;">${car.brand}</td>
                        <td style="text-align: center;">${logoThumb}</td>
                        <td style="text-align: right; font-weight: bold; color: var(--racing-accent);">${car.power || '-'} CV</td>
                        <td style="text-align: right; font-weight: 600;">${car.speed || '-'} km/h</td>
                        <td style="text-align: right; font-weight: 600;">${car.accel ? car.accel + 's' : '-'}</td>
                        <td><span style="background: var(--bg-dark); padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border-color); font-size: 11px;">${car.maker || 'N/A'}</span></td>
                        <td style="text-align: center;">
                            <div style="display: flex; gap: 4px; justify-content: center;">
                                <button onclick="openCarModal(${car.id})" class="btn btn-dark" style="padding: 6px;" title="Editar">✏️</button>
                                <button onclick="deleteCar(${car.id})" class="btn btn-dark" style="padding: 6px; color: var(--racing-red);" title="Eliminar">🗑️</button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += `</tbody></table></div>`;
            container.innerHTML = html;
        }

        function renderGridView(list, container) {
            let html = `<div class="grid-container">`;

            list.forEach(car => {
                const imageContent = car.image
                    ? `<img src="${car.image}" onerror="handleImageError(${car.id}, 'image')" class="card-img">`
                    : `<label class="card-img" style="border: 2px dashed var(--border-color); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted);">
                        <span>+ Subir Foto 1/43</span>
                        <input type="file" accept="image/*" class="hidden" onchange="uploadCarImage(event, ${car.id})">
                       </label>`;

                const logoContent = car.logo
                    ? `<img src="${car.logo}" onerror="handleImageError(${car.id}, 'logo')" class="logo-thumb">`
                    : `<label class="logo-placeholder" title="Cargar Logo Marca">
                        <span>🛡️</span>
                        <input type="file" accept="image/*" class="hidden" onchange="uploadCarLogo(event, ${car.id})">
                       </label>`;

                html += `
                    <div class="car-card">
                        <div style="position: relative;">
                            ${imageContent}
                            <div style="position: absolute; top: 8px; right: 8px; display: flex; gap: 4px;">
                                <button onclick="openCarModal(${car.id})" class="btn btn-dark" style="padding: 6px;" title="Editar">✏️</button>
                                <button onclick="deleteCar(${car.id})" class="btn btn-dark" style="padding: 6px; color: var(--racing-red);" title="Eliminar">🗑️</button>
                            </div>
                        </div>
                        <div class="card-body">
                            <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;">
                                <div>
                                    <h4 style="font-weight: 800; font-size: 14px; color: white;">${car.name}</h4>
                                    <span style="font-size: 11px; color: var(--text-muted); font-weight: 600;">${car.brand}</span>
                                </div>
                                ${logoContent}
                            </div>
                            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--bg-dark); padding: 8px; border-radius: 8px; text-align: center; font-size: 11px;">
                                <div><div style="color: var(--text-muted); font-size: 9px;">CV</div><div style="font-weight: bold; color: var(--racing-accent);">${car.power || '-'}</div></div>
                                <div><div style="color: var(--text-muted); font-size: 9px;">KM/H</div><div style="font-weight: bold;">${car.speed || '-'}</div></div>
                                <div><div style="color: var(--text-muted); font-size: 9px;">0-100</div><div style="font-weight: bold;">${car.accel ? car.accel + 's' : '-'}</div></div>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        function uploadCarImage(event, id) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                const car = cars.find(c => c.id === id);
                if (car) {
                    car.image = e.target.result;
                    await saveCarsToDB(cars);
                    updateDashboard();
                }
            };
            reader.readAsDataURL(file);
        }

        function uploadCarLogo(event, id) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                const car = cars.find(c => c.id === id);
                if (car) {
                    car.logo = e.target.result;
                    await saveCarsToDB(cars);
                    updateDashboard();
                }
            };
            reader.readAsDataURL(file);
        }

        function openCarModal(id = null) {
            const modal = document.getElementById('carModal');
            const catSelect = document.getElementById('carFormCategory');
            catSelect.innerHTML = CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('');

            const deleteBtn = document.getElementById('deleteCarBtn');

            if (id) {
                const car = cars.find(c => c.id === id);
                document.getElementById('modalTitle').innerText = 'Editar Modelo';
                document.getElementById('carFormId').value = car.id;
                document.getElementById('carFormName').value = car.name;
                document.getElementById('carFormBrand').value = car.brand;
                document.getElementById('carFormCategory').value = car.category;
                document.getElementById('carFormPower').value = car.power || '';
                document.getElementById('carFormSpeed').value = car.speed || '';
                document.getElementById('carFormAccel').value = car.accel || '';
                document.getElementById('carFormMaker').value = car.maker || '';
                deleteBtn.classList.remove('hidden');
            } else {
                document.getElementById('modalTitle').innerText = 'Añadir Nuevo Modelo';
                document.getElementById('carForm').reset();
                document.getElementById('carFormId').value = '';
                deleteBtn.classList.add('hidden');
            }

            modal.classList.add('active');
        }

        function closeCarModal() {
            document.getElementById('carModal').classList.remove('active');
        }

        async function handleCarFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('carFormId').value;
            const carData = {
                name: document.getElementById('carFormName').value.trim(),
                brand: document.getElementById('carFormBrand').value.trim(),
                category: document.getElementById('carFormCategory').value,
                power: parseInt(document.getElementById('carFormPower').value) || null,
                speed: parseInt(document.getElementById('carFormSpeed').value) || null,
                accel: parseFloat(document.getElementById('carFormAccel').value) || null,
                maker: document.getElementById('carFormMaker').value.trim() || 'Desconocido'
            };

            if (id) {
                const car = cars.find(c => c.id == id);
                Object.assign(car, carData);
            } else {
                const newId = cars.length ? Math.max(...cars.map(c => c.id)) + 1 : 1;
                cars.push({ id: newId, image: null, logo: null, ...carData });
            }

            await saveCarsToDB(cars);
            renderSubmenus();
            updateDashboard();
            closeCarModal();
        }

        function openGlobalLogoModal() {
            const select = document.getElementById('globalBrandSelect');
            const brands = [...new Set(cars.map(c => c.brand))].sort();
            select.innerHTML = brands.map(b => `<option value="${b}">${b}</option>`).join('');
            document.getElementById('globalLogoModal').classList.add('active');
        }

        function closeGlobalLogoModal() {
            document.getElementById('globalLogoModal').classList.remove('active');
        }

        function applyGlobalLogo() {
            const brand = document.getElementById('globalBrandSelect').value;
            const fileInput = document.getElementById('globalBrandLogoFile');
            if (!fileInput.files || !fileInput.files[0]) return alert('Selecciona una imagen.');

            const reader = new FileReader();
            reader.onload = async function(e) {
                const logoData = e.target.result;
                cars.forEach(car => {
                    if (car.brand.toLowerCase() === brand.toLowerCase()) {
                        car.logo = logoData;
                    }
                });
                await saveCarsToDB(cars);
                updateDashboard();
                closeGlobalLogoModal();
            };
            reader.readAsDataURL(fileInput.files[0]);
        }
    </script>
</body>
</html>
